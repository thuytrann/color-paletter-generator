<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Palette Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .palette {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
        }
        .color-box {
            width: 100px;
            height: 100px;
            border-radius: 10px;
        }
        .color-code {
            margin-top: 5px;
            font-size: 16px;
            text-align: center;
        }
        .button {
            padding: 10px 20px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        .button:hover {
            background-color: #0056b3;
        }
        .contrast-report {
            margin-top: 20px;
            font-size: 16px;
            text-align: center;
        }
        .text-box {
            width: 300px;
            padding: 10px;
            margin-top: 10px;
            border-radius: 5px;
            font-size: 16px;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>Color Palette Generator</h1>
    <button class="button" onclick="generatePalette()">Generate New Palette</button>

    <div class="palette">
        <div>
            <div class="color-box" id="primary"></div>
            <div class="color-code" id="primary-code"></div>
        </div>
        <div>
            <div class="color-box" id="secondary"></div>
            <div class="color-code" id="secondary-code"></div>
        </div>
        <div>
            <div class="color-box" id="accent1"></div>
            <div class="color-code" id="accent1-code"></div>
        </div>
        <div>
            <div class="color-box" id="accent2"></div>
            <div class="color-code" id="accent2-code"></div>
        </div>
        <div>
            <div class="color-box" id="accent3"></div>
            <div class="color-code" id="accent3-code"></div>
        </div>
    </div>

    <div class="contrast-report" id="contrast-report"></div>

    <!-- Text Boxes with Colors -->
    <div>
        <textarea class="text-box" id="primary-text-box" readonly>
            This text box has the primary color as the background and the secondary color as the text.
        </textarea>
    </div>
    <div>
        <textarea class="text-box" id="accent1-text-box" readonly>
            This text box has accent color 1 as the background and the secondary color as the text.
        </textarea>
    </div>

    <script>
        // Helper function to generate random HSL values for palette colors
        function generateHSL(hue, saturation, lightness) {
            return `hsl(${hue}, ${saturation}%, ${lightness}%)`;
        }

        // Function to calculate the luminance of a color in RGB
        function luminance(r, g, b) {
            const a = [r, g, b].map(function (v) {
                v /= 255;
                return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
            });
            return a[0] * 0.2126 + a[1] * 0.7152 + a[2] * 0.0722;
        }

        // Function to calculate the contrast ratio between two colors
        function contrast(r1, g1, b1, r2, g2, b2) {
            const L1 = luminance(r1, g1, b1) + 0.05;
            const L2 = luminance(r2, g2, b2) + 0.05;
            return L1 > L2 ? L1 / L2 : L2 / L1;
        }

        // Function to convert HSL to RGB
        function hslToRgb(h, s, l) {
            s /= 100;
            l /= 100;
            const c = (1 - Math.abs(2 * l - 1)) * s;
            const x = c * (1 - Math.abs(((h / 60) % 2) - 1));
            const m = l - c / 2;
            let r, g, b;
            if (h >= 0 && h < 60) {
                r = c;
                g = x;
                b = 0;
            } else if (h >= 60 && h < 120) {
                r = x;
                g = c;
                b = 0;
            } else if (h >= 120 && h < 180) {
                r = 0;
                g = c;
                b = x;
            } else if (h >= 180 && h < 240) {
                r = 0;
                g = x;
                b = c;
            } else if (h >= 240 && h < 300) {
                r = x;
                g = 0;
                b = c;
            } else {
                r = c;
                g = 0;
                b = x;
            }
            r = Math.round((r + m) * 255);
            g = Math.round((g + m) * 255);
            b = Math.round((b + m) * 255);
            return [r, g, b];
        }

        function generatePalette() {
            let primaryHue, secondaryHue, accent1Hue, accent2Hue, accent3Hue;
            let primarySaturation, secondarySaturation, accent1Saturation, accent2Saturation, accent3Saturation;
            let primaryLightness, secondaryLightness, accent1Lightness, accent2Lightness, accent3Lightness;
            let contrastSecondaryOnPrimary, contrastSecondaryOnAccent1;

            // Repeat until we get valid colors with good contrast ratios
            do {
                // Base hue for consistency
                const baseHue = Math.floor(Math.random() * 360); // Random base hue between 0 and 360

                // Randomize primary color lightness to be either light or dark
                const isLightPrimary = Math.random() > 0.5; // 50% chance for light or dark background

                // Primary Color (Background)
                primaryHue = baseHue;
                primarySaturation = 50; // Moderate saturation
                primaryLightness = isLightPrimary ? 85 : 30; // Light background or dark background

                // Secondary Color (Text) and Accent Colors will contrast with Primary
                secondaryHue = baseHue;
                secondarySaturation = 30; // Lower saturation for text
                secondaryLightness = isLightPrimary ? 20 : 80; // Dark text for light background or light text for dark background

                accent1Hue = baseHue;
                accent1Saturation = 60; // More saturated to make it stand out
                accent1Lightness = isLightPrimary ? 60 : 40; // Light accent for dark background or dark accent for light background

                accent2Hue = baseHue + 30; // Slight variation, stays in same range
                accent2Saturation = 40;
                accent2Lightness = isLightPrimary ? 50 : 70; // Slightly muted for balance

                // Deciding whether Accent 3 should be complementary or similar hue
                const isComplementary = Math.random() > 0.5; // 50% chance for complementary color

                if (isComplementary) {
                    accent3Hue = (baseHue + 180) % 360; // Complementary hue (180 degrees away)
                } else {
                    // If not complementary, adjust hue by a small random value close to baseHue
                    const variation = Math.floor(Math.random() * 61) - 30; // Random value between -30 and +30
                    accent3Hue = (baseHue + variation + 360) % 360; // Ensure hue stays within 0-360
                }

                accent3Saturation = 70;
                accent3Lightness = isLightPrimary ? 40 : 60; // Pop color that contrasts with the primary color

                // Convert HSL to RGB for contrast calculation
                const [primaryR, primaryG, primaryB] = hslToRgb(primaryHue, primarySaturation, primaryLightness);
                const [secondaryR, secondaryG, secondaryB] = hslToRgb(secondaryHue, secondarySaturation, secondaryLightness);
                const [accent1R, accent1G, accent1B] = hslToRgb(accent1Hue, accent1Saturation, accent1Lightness);

                // Contrast Ratio Calculations
                contrastSecondaryOnPrimary = contrast(secondaryR, secondaryG, secondaryB, primaryR, primaryG, primaryB);
                contrastSecondaryOnAccent1 = contrast(secondaryR, secondaryG, secondaryB, accent1R, accent1G, accent1B);

            } while (contrastSecondaryOnPrimary < 5 || contrastSecondaryOnAccent1 < 5); // Ensure contrast ratios are >= 5.00:1

            // Apply colors to HTML
            document.getElementById("primary").style.backgroundColor = generateHSL(primaryHue, primarySaturation, primaryLightness);
            document.getElementById("primary-code").textContent = generateHSL(primaryHue, primarySaturation, primaryLightness);

            document.getElementById("secondary").style.backgroundColor = generateHSL(secondaryHue, secondarySaturation, secondaryLightness);
            document.getElementById("secondary-code").textContent = generateHSL(secondaryHue, secondarySaturation, secondaryLightness);

            document.getElementById("accent1").style.backgroundColor = generateHSL(accent1Hue, accent1Saturation, accent1Lightness);
            document.getElementById("accent1-code").textContent = generateHSL(accent1Hue, accent1Saturation, accent1Lightness);

            document.getElementById("accent2").style.backgroundColor = generateHSL(accent2Hue, accent2Saturation, accent2Lightness);
            document.getElementById("accent2-code").textContent = generateHSL(accent2Hue, accent2Saturation, accent2Lightness);

            document.getElementById("accent3").style.backgroundColor = generateHSL(accent3Hue, accent3Saturation, accent3Lightness);
            document.getElementById("accent3-code").textContent = generateHSL(accent3Hue, accent3Saturation, accent3Lightness);

            // Apply colors to text boxes
            document.getElementById("primary-text-box").style.backgroundColor = generateHSL(primaryHue, primarySaturation, primaryLightness);
            document.getElementById("primary-text-box").style.color = generateHSL(secondaryHue, secondarySaturation, secondaryLightness);

            document.getElementById("accent1-text-box").style.backgroundColor = generateHSL(accent1Hue, accent1Saturation, accent1Lightness);
            document.getElementById("accent1-text-box").style.color = generateHSL(secondaryHue, secondarySaturation, secondaryLightness);

            // Display the contrast report
            document.getElementById("contrast-report").innerHTML = `
                <p>Contrast Ratio of Secondary on Primary: ${contrastSecondaryOnPrimary.toFixed(2)}:1</p>
                <p>Contrast Ratio of Secondary on Accent 1: ${contrastSecondaryOnAccent1.toFixed(2)}:1</p>
            `;
        }

        // Generate an initial palette
        generatePalette();
    </script>

</body>
</html>
